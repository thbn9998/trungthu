<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Trung Thu - THACO AUTO Bắc Ninh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Glassmorphism form */
        .glass-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Input styling for high contrast */
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            color: #1e1b4b;
            border: 2px solid #fbbf24;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 10px #fbbf24;
            border-color: #f59e0b;
        }

        /* CSS Animations */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes swing {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            100% { transform: rotate(-10deg); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .anim-star { animation: twinkle 3s infinite ease-in-out; }
        .anim-star:nth-child(even) { animation-duration: 2s; }
        .anim-lantern { animation: swing 4s infinite ease-in-out; transform-origin: top center; }
        .anim-sticker { animation: float 6s infinite ease-in-out; }
        
        .modal-animate { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Elements (Stars) -->
    <div class="fixed top-10 left-10 text-yellow-300 text-2xl anim-star pointer-events-none">✨</div>
    <div class="fixed top-20 right-20 text-yellow-300 text-3xl anim-star pointer-events-none">✨</div>
    <div class="fixed bottom-20 left-1/4 text-yellow-300 text-xl anim-star pointer-events-none">✨</div>
    <div class="fixed top-1/3 right-10 text-yellow-300 text-2xl anim-star pointer-events-none">✨</div>

    <!-- Floating Stickers -->
    <div class="fixed top-10 right-4 text-5xl anim-sticker pointer-events-none" style="animation-delay: 1s;">🌕</div>
    <div class="fixed bottom-10 left-4 text-4xl anim-sticker pointer-events-none" style="animation-delay: 2s;">🐰</div>
    <div class="fixed bottom-32 right-10 text-4xl anim-sticker pointer-events-none" style="animation-delay: 0.5s;">🥮</div>
    <div class="fixed top-1/4 left-5 text-4xl anim-sticker pointer-events-none" style="animation-delay: 1.5s;">☁️</div>

    <!-- Lanterns -->
    <div class="fixed -top-2 left-1/4 text-5xl anim-lantern pointer-events-none">🏮</div>
    <div class="fixed -top-2 right-1/4 text-5xl anim-lantern pointer-events-none" style="animation-delay: 1s;">🏮</div>

    <!-- Main Form Container -->
    <div class="glass-form rounded-2xl p-6 md:p-8 w-full max-w-md relative z-10">
        
        <!-- THACO AUTO Logo (Updated filename) -->
        <img src="Asset 6thaco auto.png" alt="THACO AUTO Bắc Ninh" class="w-full max-w-[250px] mx-auto bg-white p-2 rounded-lg mb-6">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-yellow-400 mb-2 uppercase drop-shadow-md">Vui Hội Trăng Rằm</h1>
            <p class="text-white text-sm">Điền thông tin tham gia Minigame </p>
            <p class="text-white text-sm">cùng THACO AUTO Bắc Ninh tại Công viên Hữu Nghị Quốc Tế</p>
        </div>

        <form id="minigameForm" class="space-y-4">
            <!-- Họ và tên -->
            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="fullname">Họ và tên *</label>
                <input type="text" id="fullname" required placeholder="Nhập họ và tên của bạn" 
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <!-- Số điện thoại -->
            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="phone">Số điện thoại *</label>
                <input type="tel" id="phone" required placeholder="Nhập số điện thoại" pattern="[0-9]{10}"
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <!-- Địa chỉ -->
            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="address">Địa chỉ *</label>
                <input type="text" id="address" required placeholder="Nhập địa chỉ của bạn" 
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <!-- CCCD (Không bắt buộc) -->
            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="cccd">Mã CCCD <span class="text-gray-300 font-normal text-sm">(Không bắt buộc)</span></label>
                <input type="text" id="cccd" placeholder="Nhập số CCCD" 
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <!-- Dòng xe quan tâm -->
            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="car_model">Sản phẩm xe bạn có thể quan tâm *</label>
                <select id="car_model" required class="input-field w-full px-4 py-3 rounded-xl font-medium appearance-none">
                    <option value="" disabled selected>-- Chọn dòng xe --</option>
                    <option value="Mazda2">Mazda2</option>
                    <option value="Mazda CX-5">Mazda CX-5</option>
                    <option value="Peugeot 2008">Peugeot 2008</option>
                    <option value="Peugeot 3008">Peugeot 3008</option>
                    <option value="BMW 3 Series">BMW 3 Series</option>
                    <option value="BMW X3">BMW X3</option>
                </select>
            </div>

            <!-- Nút Submit -->
            <button type="submit" 
                class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white font-bold py-4 rounded-xl text-lg uppercase shadow-lg transform transition hover:scale-105 active:scale-95 mt-4">
                Đăng ký tham gia ngay 🚀
            </button>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl" id="modalContent">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-red-600 mb-2 uppercase">Đăng ký thành công!</h2>
            <p class="text-gray-700 font-medium text-lg mb-6 leading-relaxed">
                Vui lòng đưa màn hình này cho nhân viên để xác nhận và tham gia minigame nhé! 🎁
            </p>
            <button onclick="closeModal()" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                Đóng
            </button>
        </div>
    </div>

    <script>
        document.getElementById('minigameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Show modal
            const modal = document.getElementById('successModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modalContent.classList.add('modal-animate');
        });

        function closeModal() {
            const modal = document.getElementById('successModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modalContent.classList.remove('modal-animate');
            
            // Reset form
            document.getElementById('minigameForm').reset();
        }
    </script>
</body>
</html>
