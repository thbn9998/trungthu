<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game Trung Thu - THACO AUTO Bắc Ninh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Glassmorphism form */
        .glass-form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        /* Input styling */
        .input-field {
            background: rgba(255, 255, 255, 0.9);
            color: #1e1b4b;
            border: 2px solid #fbbf24;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 10px #fbbf24;
            border-color: #f59e0b;
        }

        /* Animations */
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
        @keyframes swing { 0% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } 100% { transform: rotate(-10deg); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        @keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); opacity: 1; } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }
        
        .anim-star { animation: twinkle 3s infinite ease-in-out; }
        .anim-star:nth-child(even) { animation-duration: 2s; }
        .anim-lantern { animation: swing 4s infinite ease-in-out; transform-origin: top center; }
        .anim-sticker { animation: float 6s infinite ease-in-out; }
        .modal-animate { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Elements -->
    <div class="fixed top-10 left-10 text-yellow-300 text-2xl anim-star pointer-events-none">✨</div>
    <div class="fixed top-20 right-20 text-yellow-300 text-3xl anim-star pointer-events-none">✨</div>
    <div class="fixed bottom-20 left-1/4 text-yellow-300 text-xl anim-star pointer-events-none">✨</div>
    <div class="fixed top-1/3 right-10 text-yellow-300 text-2xl anim-star pointer-events-none">✨</div>

    <div class="fixed top-10 right-4 text-5xl anim-sticker pointer-events-none" style="animation-delay: 1s;">🌕</div>
    <div class="fixed bottom-10 left-4 text-4xl anim-sticker pointer-events-none" style="animation-delay: 2s;">🐰</div>
    <div class="fixed bottom-32 right-10 text-4xl anim-sticker pointer-events-none" style="animation-delay: 0.5s;">🥮</div>
    <div class="fixed top-1/4 left-5 text-4xl anim-sticker pointer-events-none" style="animation-delay: 1.5s;">☁️</div>

    <div class="fixed -top-2 left-1/4 text-5xl anim-lantern pointer-events-none">🏮</div>
    <div class="fixed -top-2 right-1/4 text-5xl anim-lantern pointer-events-none" style="animation-delay: 1s;">🏮</div>

    <!-- Main Form Container -->
    <div class="glass-form rounded-2xl p-6 md:p-8 w-full max-w-md relative z-10">
        
        <!-- Logo -->
        <img src="Asset 6thaco auto.png" alt="THACO AUTO Bắc Ninh" class="w-full max-w-[250px] mx-auto bg-white p-2 rounded-lg mb-6">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-yellow-400 mb-2 uppercase drop-shadow-md">Vui Hội Trăng Rằm</h1>
            <p class="text-white text-sm">Điền thông tin tham gia Minigame</p>
            <p class="text-white text-sm">cùng THACO AUTO Bắc Ninh</p>
            <p class="text-white text-sm">tại Công viên Hữu Nghị Quốc Tế</p>
        </div>

        <form id="minigameForm" class="space-y-4">
            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="fullname">Họ và tên *</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Nhập họ và tên của bạn" 
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="phone">Số điện thoại *</label>
                <input type="tel" id="phone" name="phone" required placeholder="Nhập số điện thoại" pattern="[0-9]{10}"
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="address">Địa chỉ *</label>
                <input type="text" id="address" name="address" required placeholder="Nhập địa chỉ của bạn" 
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="cccd">Mã CCCD <span class="text-gray-300 font-normal text-sm">(Không bắt buộc)</span></label>
                <input type="text" id="cccd" name="cccd" placeholder="Nhập số CCCD" 
                    class="input-field w-full px-4 py-3 rounded-xl font-medium">
            </div>

            <div>
                <label class="block text-yellow-400 font-bold mb-1 ml-1" for="car_model">Sản phẩm xe bạn có thể quan tâm *</label>
                <select id="car_model" name="car_model" required class="input-field w-full px-4 py-3 rounded-xl font-medium appearance-none">
                    <option value="" disabled selected>-- Chọn dòng xe --</option>
                    <option value="Mazda2">Mazda2</option>
                    <option value="Mazda CX-5">Mazda CX-5</option>
                    <option value="Peugeot 2008">Peugeot 2008</option>
                    <option value="Peugeot 3008">Peugeot 3008</option>
                    <option value="BMW 3 Series">BMW 3 Series</option>
                    <option value="BMW X3">BMW X3</option>
                </select>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white font-bold py-4 rounded-xl text-lg uppercase shadow-lg transform transition hover:scale-105 active:scale-95 mt-4 flex justify-center items-center">
                <span>Đăng ký tham gia ngay 🚀</span>
                <svg id="loadingSpinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl" id="modalContent">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-red-600 mb-2 uppercase">Đăng ký thành công!</h2>
            <p class="text-gray-700 font-medium text-lg mb-6 leading-relaxed">
                Vui lòng đưa màn hình này cho nhân viên để xác nhận và tham gia minigame nhé! 🎁
            </p>
            <button onclick="closeModal()" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                Đóng
            </button>
        </div>
    </div>

    <script>
        // Link Apps Script bạn vừa cung cấp
        const scriptURL = 'https://script.google.com/macros/s/AKfycbznProbM_lLmZ0uPeq3lrxrjkVX-2k0ZzdGnKk372cQ4sCBOCM9hv9Rxy0h_jexnKpHAA/exec';
        
        const form = document.getElementById('minigameForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('loadingSpinner');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.querySelector('span').innerText = 'Đang xử lý...';
            spinner.classList.remove('hidden');

            // Đóng gói dữ liệu thành đường link GET an toàn tuyệt đối
            const formData = new FormData(form);
            const params = new URLSearchParams(formData).toString();
            const finalURL = scriptURL + "?" + params;

            // Sử dụng GET + no-cors
            fetch(finalURL, { method: 'GET', mode: 'no-cors' })
            .then(response => {
                // Hiển thị modal thành công
                const modal = document.getElementById('successModal');
                const modalContent = document.getElementById('modalContent');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                modalContent.classList.add('modal-animate');
                
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = 'Đăng ký tham gia ngay 🚀';
                spinner.classList.add('hidden');
            })
            .catch(error => {
                // Xử lý lỗi
                alert('Lỗi mạng! Vui lòng thử lại.');
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = 'Đăng ký tham gia ngay 🚀';
                spinner.classList.add('hidden');
            });
        });

        function closeModal() {
            const modal = document.getElementById('successModal');
            const modalContent = document.getElementById('modalContent');
            
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modalContent.classList.remove('modal-animate');
            // Xóa rỗng form sau khi đóng
            document.getElementById('minigameForm').reset();
        }
    </script>
</body>
</html>
